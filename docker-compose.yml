services:

  php:
    image: php:8.4-fpm
    build: .
    container_name: php
    volumes:
      - ./app:/var/www/html
      - ./php.ini:/usr/local/etc/php/php.ini
    environment:
      - SYMFONY_ENV=dev
    ports:
      - "9000:9000"
    depends_on:
      - mariadb
    networks:
      - mon-app-symfony


  mariadb:
    image: mariadb:latest
    container_name: mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: commerce_db
      MYSQL_USER: symfony
      MYSQL_PASSWORD: symfony
    ports:
      - "3307:3306" # Le port local est maintenant 3307
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mon-app-symfony

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      - MAILPIT_RELAY=127.0.0.1:25
    networks:
      - mon-app-symfony

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - mon-app-symfony

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mariadb # Nom du conteneur MariaDB
      PMA_PORT: 3306    # Port interne utilisé par phpMyAdmin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80" # Accès à phpMyAdmin via le port 8081
    depends_on:
      - mariadb
    networks:
      - mon-app-symfony

  redis:
    image: redis:7
    container_name: my-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - mon-app-symfony

  rabbitmq:
    image: rabbitmq:3.7-management
    container_name: rabbitmq-mysql
    environment:
      RABBITMQ_USER: 'guest'
      RABBITMQ_PASS: 'guest'
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - mon-app-symfony

volumes:
  db_data:
  redis-data:
networks:
  mon-app-symfony: